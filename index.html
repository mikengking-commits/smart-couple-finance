<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Smart Couple</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#142027;
    --ink-soft:#4B5D5A;
    --bg:#F3F8F6;
    --paper:#FFFFFF;
    --teal-deep:#0B5E56;
    --teal-mid:#1C8C7C;
    --teal-pale:#E1F0EC;
    --gold:#E3A23C;
    --gold-pale:#FCEFD9;
    --coral:#DD6B4E;
    --coral-pale:#FBE7E0;
    --line:#DDE7E3;
    --shadow: 0 1px 2px rgba(20,32,39,0.04), 0 8px 24px rgba(20,32,39,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    font-family:'Plus Jakarta Sans', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }
  .frame{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--paper);
    box-shadow: var(--shadow);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  h1,h2,h3,.display{ font-family:'Space Grotesk', sans-serif; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  /* ---------- GATE / SETUP ---------- */
  .gate{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:36px 28px; background:
    radial-gradient(120% 80% at 10% -10%, var(--teal-pale) 0%, transparent 60%),
    radial-gradient(90% 60% at 110% 110%, var(--gold-pale) 0%, transparent 55%);
  }
  .brand-mark{ width:52px; height:52px; margin-bottom:18px; }
  .gate h1{ font-size:30px; margin:0 0 6px; color:var(--teal-deep); }
  .gate p.sub{ margin:0 0 28px; color:var(--ink-soft); font-size:14.5px; line-height:1.5; max-width:340px;}
  label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.04em;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:12px;
    font-family:inherit; font-size:15px; background:#fff; color:var(--ink); margin-bottom:16px;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--teal-mid); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background:var(--teal-deep); color:#fff; border:none; border-radius:12px;
    padding:13px 20px; font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:15px;
    cursor:pointer; width:100%; transition:transform .12s ease, background .15s ease;
  }
  .btn:hover{ background:#0a4f48; }
  .btn:active{ transform:scale(0.98); }
  .btn.ghost{ background:transparent; color:var(--teal-deep); border:1.5px solid var(--teal-deep); }
  .btn.coral{ background:var(--coral); }
  .btn.gold{ background:var(--gold); color:#3a2a0d; }
  .btn.small{ padding:8px 14px; font-size:13px; width:auto; border-radius:10px; }
  .hint{ font-size:12.5px; color:var(--ink-soft); margin-top:-8px; margin-bottom:18px; line-height:1.5;}
  .row{ display:flex; gap:12px; }
  .row > *{ flex:1; }

  /* ---------- APP SHELL ---------- */
  .app{ flex:1; display:flex; flex-direction:column; }
  .topbar{
    padding:18px 20px 14px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--paper); z-index:5;
  }
  .topbar .title{ font-size:19px; font-weight:600; }
  .topbar .code-pill{ font-size:11px; color:var(--teal-deep); background:var(--teal-pale); padding:4px 10px; border-radius:20px; font-weight:600; letter-spacing:.03em; }
  .content{ flex:1; overflow-y:auto; padding:18px 20px 100px; }
  .section-label{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:700; margin:22px 0 10px; }
  .section-label:first-child{ margin-top:0; }

  .card{ background:var(--paper); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
  .card.tint-teal{ background:var(--teal-pale); border-color:transparent; }
  .card.tint-gold{ background:var(--gold-pale); border-color:transparent; }
  .card.tint-coral{ background:var(--coral-pale); border-color:transparent; }

  .balance-hero{ text-align:left; padding:22px 18px; border-radius:20px; background:linear-gradient(135deg, var(--teal-deep), #0a4a44); color:#fff; margin-bottom:16px;}
  .balance-hero .lbl{ font-size:12px; opacity:.75; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  .balance-hero .amt{ font-size:32px; font-weight:600; }
  .balance-hero .sub{ font-size:12.5px; opacity:.8; margin-top:6px; }

  .quickrow{ display:flex; gap:10px; margin-bottom:18px; }
  .quickrow .btn{ flex:1; }

  .txn-row{ display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .txn-row:last-child{ border-bottom:none; }
  .txn-icon{ width:38px; height:38px; border-radius:10px; background:var(--teal-pale); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .txn-icon.income{ background:var(--gold-pale); }
  .txn-main{ flex:1; min-width:0; }
  .txn-main .top{ display:flex; justify-content:space-between; gap:8px; }
  .txn-main .cat{ font-weight:600; font-size:14.5px; }
  .txn-main .amt{ font-weight:600; font-size:14.5px; white-space:nowrap; }
  .txn-main .amt.income{ color:var(--teal-deep); }
  .txn-main .amt.expense{ color:var(--ink); }
  .txn-main .meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .txn-main .note{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; font-style:italic; }
  .del-x{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px; padding:2px 4px; }
  .del-x:hover{ color:var(--coral); }

  .budget-item{ margin-bottom:16px; }
  .budget-item .head{ display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px; }
  .budget-item .head .cat{ font-weight:600; }
  .bar-track{ height:8px; border-radius:6px; background:var(--line); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:6px; background:var(--teal-mid); }
  .bar-fill.warn{ background:var(--gold); }
  .bar-fill.over{ background:var(--coral); }

  .goal-card{ display:flex; gap:14px; align-items:center; }
  .goal-info{ flex:1; min-width:0; }
  .goal-info h3{ font-size:15.5px; margin:0 0 4px; }
  .goal-info .meta{ font-size:12px; color:var(--ink-soft); }
  .goal-pct{ font-size:11.5px; font-weight:600; color:var(--teal-deep); margin-top:4px; }
  .goal-pct.behind{ color:var(--coral); }

  .alert{ display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-radius:12px; margin-bottom:10px; font-size:13px; line-height:1.45; }
  .alert.warn{ background:var(--gold-pale); color:#6b4b12; }
  .alert.over{ background:var(--coral-pale); color:#8a3a24; }

  .rate-card{ display:flex; justify-content:space-between; align-items:center; padding:10px 14px; }
  .rate-card .r{ font-size:13.5px; }
  .rate-list{ display:flex; flex-direction:column; gap:6px; }
  .rate-list .r-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0;}
  .refresh-btn{ background:none; border:none; color:var(--teal-deep); font-size:12px; font-weight:600; cursor:pointer; }

  .tabbar{
    position:sticky; bottom:0; display:flex; background:var(--paper); border-top:1px solid var(--line);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; cursor:pointer; color:var(--ink-soft); padding:6px 2px; border-radius:10px; }
  .tab.active{ color:var(--teal-deep); }
  .tab .ic{ font-size:19px; }
  .tab .lb{ font-size:10.5px; font-weight:600; }

  .fab{ position:absolute; right:20px; bottom:84px; width:52px; height:52px; border-radius:50%; background:var(--gold); border:none; box-shadow:var(--shadow); font-size:24px; color:#3a2a0d; cursor:pointer; z-index:6;}

  .modal-backdrop{ position:absolute; inset:0; background:rgba(20,32,39,0.45); z-index:20; display:flex; align-items:flex-end; }
  .modal{ background:var(--paper); width:100%; max-height:88%; overflow-y:auto; border-radius:22px 22px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); }
  .modal h2{ font-size:19px; margin:0 0 16px; }
  .modal-close{ float:right; background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; }
  .segmented{ display:flex; background:var(--bg); border-radius:10px; padding:3px; margin-bottom:16px; }
  .segmented button{ flex:1; background:none; border:none; padding:9px 6px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; }
  .segmented button.active{ background:#fff; color:var(--teal-deep); box-shadow:var(--shadow); }
  .inline-convert{ font-size:12.5px; color:var(--teal-deep); margin:-10px 0 16px; font-weight:600; }
  .empty{ text-align:center; padding:40px 20px; color:var(--ink-soft); }
  .empty .em-ic{ font-size:34px; margin-bottom:10px; }
  .empty p{ font-size:13.5px; margin:0; line-height:1.5; }

  .protect-list{ list-style:none; padding:0; margin:0; }
  .protect-list li{ display:flex; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13.5px; line-height:1.5; }
  .protect-list li:last-child{ border-bottom:none; }
  .protect-list .ic{ font-size:16px; flex-shrink:0; }

  a.linklike{ color:var(--teal-deep); cursor:pointer; font-weight:600; text-decoration:underline; }
  ::-webkit-scrollbar{ width:0px; }
</style>
</head>
<body>
<div class="frame" id="frame"></div>

<script>
/* ============================= CONSTANTS ============================= */
const CATEGORIES = [
  {id:'food', label:'Food & Groceries', icon:'🍽️'},
  {id:'transport', label:'Transportation', icon:'🚗'},
  {id:'housing', label:'Housing & Rent', icon:'🏠'},
  {id:'utilities', label:'Utilities', icon:'💡'},
  {id:'remittance', label:'Padala / Remittance', icon:'📨'},
  {id:'savings', label:'Savings', icon:'💰'},
  {id:'health', label:'Healthcare', icon:'🏥'},
  {id:'education', label:'Education', icon:'🎓'},
  {id:'entertainment', label:'Entertainment', icon:'🎬'},
  {id:'debt', label:'Debt Payment', icon:'💳'},
  {id:'insurance', label:'Insurance', icon:'🛡️'},
  {id:'other', label:'Other', icon:'📦'}
];
const CURRENCIES = ['PHP','USD','SGD','AED','SAR','QAR','KWD','BHD','OMR','HKD','JPY','GBP','EUR','CAD','AUD','NZD','KRW','TWD','MYR','THB','CNY','ILS'];
const SYMBOLS = {PHP:'₱',USD:'$',SGD:'S$',AED:'د.إ',SAR:'﷼',QAR:'ر.ق',KWD:'د.ك',BHD:'.د.ب',OMR:'ر.ع.',HKD:'HK$',JPY:'¥',GBP:'£',EUR:'€',CAD:'C$',AUD:'A$',NZD:'NZ$',KRW:'₩',TWD:'NT$',MYR:'RM',THB:'฿',CNY:'¥',ILS:'₪'};

/* ============================= STATE ============================= */
let state = {
  screen: 'gate',       // gate | setup | app
  code: '',             // household code, session-only (not stored)
  tab: 'dashboard',
  modal: null,          // {type:'txn'|'goal'|'goal-contrib'|'budget', payload}
  data: null,           // loaded household data
  rates: null,          // {base:'USD', rates:{...}, fetchedAt}
  ratesLoading: false,
  txnDraft: {},
  goalDraft: {},
};

function defaultData(){
  return {
    createdAt: Date.now(),
    settings:{
      baseCurrency:'PHP',
      partnerA:'Partner A',
      partnerB:'Partner B',
      currencies:['PHP','USD'],
      alertThreshold: 5000
    },
    transactions: [],
    goals: [],
    budgets: []
  };
}

function keyFor(code){
  const clean = code.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'');
  return 'household_' + clean;
}

/* ============================= STORAGE (Firebase) ============================= */
// 1. Paste your web app's config from the Firebase console here (Project settings > your app).
// These values are meant to be public in client-side code — they identify the project,
// they are not a secret — the Firestore Rules are what actually control access.
const firebaseConfig = {
  apiKey: "AIzaSyB0adcP9S0hrgGkVIe3PkzyfVo-f79x5Pw",
  authDomain: "smart-couple-finance.firebaseapp.com",
  projectId: "smart-couple-finance",
  storageBucket: "smart-couple-finance.firebasestorage.app",
  messagingSenderId: "253078267643",
  appId: "1:253078267643:web:0226054c24c477d64e725e"
};
let db = null;
let unsubscribeSnapshot = null;
function firebaseReady(){
  if(firebaseConfig.apiKey.startsWith('PASTE_')) return false;
  if(!db){ firebase.initializeApp(firebaseConfig); db = firebase.firestore(); }
  return true;
}
async function loadHousehold(code){
  if(!firebaseReady()) return 'NOT_CONFIGURED';
  try{
    const doc = await db.collection('households').doc(keyFor(code)).get();
    return doc.exists ? doc.data() : null;
  }catch(e){
    console.error('load failed', e);
    return 'ERROR';
  }
}
async function saveHousehold(code, data){
  if(!firebaseReady()) return;
  try{
    await db.collection('households').doc(keyFor(code)).set(data);
  }catch(e){
    console.error('save failed', e);
  }
}
function subscribeToHousehold(code){
  if(!firebaseReady()) return;
  if(unsubscribeSnapshot) unsubscribeSnapshot();
  unsubscribeSnapshot = db.collection('households').doc(keyFor(code)).onSnapshot(doc=>{
    if(!doc.exists) return;
    state.data = doc.data();
    // Avoid wiping out whatever the person is mid-typing in an open form.
    if(!state.modal) render();
  }, err=>{ console.error('listener error', err); });
}

/* ============================= EXCHANGE RATES ============================= */
async function fetchRates(silent){
  if(!silent){ state.ratesLoading = true; render(); }
  try{
    const resp = await fetch('https://open.er-api.com/v6/latest/USD');
    const json = await resp.json();
    if(json && json.rates){
      state.rates = { base:'USD', rates: json.rates, fetchedAt: Date.now() };
    }
  }catch(e){
    console.error('rate fetch failed', e);
  }
  state.ratesLoading = false;
  render();
}
let rateAutoRefreshTimer = null;
function startRateAutoRefresh(){
  if(rateAutoRefreshTimer) return;
  // Quietly re-check every 5 minutes while the app is open — this feed itself
  // is a daily reference rate, not tick-by-tick trading data, but this keeps you
  // current with it rather than stuck on whatever was live when you first opened the app.
  rateAutoRefreshTimer = setInterval(()=>fetchRates(true), 5*60*1000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible'){
      const staleMs = state.rates ? Date.now() - state.rates.fetchedAt : Infinity;
      if(staleMs > 5*60*1000) fetchRates(true);
    }
  });
}
function convert(amount, from, to){
  if(from === to) return amount;
  if(!state.rates) return null;
  const r = state.rates.rates;
  if(!r[from] || !r[to]) return null;
  const usd = amount / r[from];
  return usd * r[to];
}
function fmt(amount, currency){
  const sym = SYMBOLS[currency] || currency+' ';
  if(amount === null || amount === undefined || isNaN(amount)) return '—';
  return sym + Number(amount).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
}
function toBase(amount, currency){
  const base = state.data.settings.baseCurrency;
  if(currency === base) return amount;
  const c = convert(amount, currency, base);
  return c === null ? amount : c;
}

/* ============================= DERIVED HELPERS ============================= */
function monthKey(ts){ const d = new Date(ts); return d.getFullYear()+'-'+d.getMonth(); }
function currentMonthTxns(){
  const mk = monthKey(Date.now());
  return state.data.transactions.filter(t => monthKey(t.date) === mk);
}
function totalsThisMonth(){
  let income=0, expense=0;
  currentMonthTxns().forEach(t=>{
    const base = toBase(t.amount, t.currency);
    if(t.type==='income') income += base; else expense += base;
  });
  return {income, expense, net: income-expense};
}
function spentInCategory(catId){
  let sum = 0;
  currentMonthTxns().forEach(t=>{
    if(t.type==='expense' && t.category === catId) sum += toBase(t.amount, t.currency);
  });
  return sum;
}
function computeCoupleBalance(){
  // positive => Partner B owes Partner A ; negative => Partner A owes Partner B
  let net = 0;
  state.data.transactions.forEach(t=>{
    if(t.type !== 'expense') return;
    const base = toBase(t.amount, t.currency);
    let shareA, shareB;
    if(t.splitType === 'equal'){ shareA = base/2; shareB = base/2; }
    else if(t.splitType === 'custom'){ shareA = base*(t.percentA||50)/100; shareB = base - shareA; }
    else if(t.splitType === 'A'){ shareA = base; shareB = 0; }
    else if(t.splitType === 'B'){ shareA = 0; shareB = base; }
    else { shareA = base/2; shareB = base/2; }
    if(t.paidBy === 'A') net += shareB;
    else if(t.paidBy === 'B') net -= shareA;
    // paidBy 'Joint' -> no debt created
  });
  return net;
}
function computeTotalSavings(){
  // Your actual net total: every income transaction (whatever category it was logged
  // under — salary, a Transportation reimbursement, anything) minus every expense,
  // across your whole history. This is "what we've saved," full stop — not narrowed
  // to a single category, and not netted against what other goals have already used.
  let total = 0;
  state.data.transactions.forEach(t=>{
    const base = toBase(t.amount, t.currency);
    if(t.type === 'income') total += base; else total -= base;
  });
  return total;
}
function goalPace(g){
  const now = Date.now();
  const start = g.createdAt || now;
  const end = new Date(g.deadline).getTime();
  let timePct = 0;
  if(end > start){
    timePct = Math.min(100, Math.max(0, ((now-start)/(end-start))*100));
  } else { timePct = 100; }
  const amountPct = g.targetAmount > 0 ? Math.min(100, (g.currentAmount/g.targetAmount)*100) : 0;
  return {timePct, amountPct, behind: amountPct + 8 < timePct };
}
function computeAlerts(){
  const alerts = [];
  state.data.budgets.forEach(b=>{
    const spent = spentInCategory(b.category);
    const limitBase = toBase(b.limit, b.currency);
    const cat = CATEGORIES.find(c=>c.id===b.category);
    if(limitBase>0){
      const pct = spent/limitBase*100;
      if(pct >= 100) alerts.push({level:'over', text:`${cat?cat.label:b.category} is over budget — ${fmt(spent,state.data.settings.baseCurrency)} of ${fmt(limitBase,state.data.settings.baseCurrency)} spent this month.`});
      else if(pct >= 90) alerts.push({level:'warn', text:`${cat?cat.label:b.category} is at ${pct.toFixed(0)}% of this month's budget.`});
    }
  });
  state.data.goals.forEach(g=>{
    const p = goalPace(g);
    if(p.behind && p.amountPct < 100){
      alerts.push({level:'warn', text:`"${g.title}" is behind pace — ${p.amountPct.toFixed(0)}% saved but ${p.timePct.toFixed(0)}% of the time to your deadline has passed.`});
    }
  });
  const threshold = state.data.settings.alertThreshold || 0;
  const mk = monthKey(Date.now());
  state.data.transactions.filter(t=>t.type==='expense' && monthKey(t.date)===mk).forEach(t=>{
    if(toBase(t.amount,t.currency) >= threshold && threshold>0){
      const cat = CATEGORIES.find(c=>c.id===t.category);
      alerts.push({level:'warn', text:`Large expense recorded: ${fmt(t.amount,t.currency)} on ${cat?cat.label:t.category}${t.note? ' — "'+t.note+'"':''}.`});
    }
  });
  return alerts;
}

/* ============================= ACTIONS ============================= */
async function persist(){ await saveHousehold(state.code, state.data); }

function openModal(type, payload){ state.modal = {type, payload: payload||{}}; render(); }
function closeModal(){ state.modal = null; render(); }

async function submitTxn(form){
  const amount = parseFloat(form.amount.value);
  if(!amount || amount<=0) return;
  const txn = {
    id: 'tx_'+Date.now()+Math.random().toString(36).slice(2,7),
    type: form.type.value,
    amount, currency: form.currency.value,
    category: form.category.value,
    date: new Date(form.date.value).getTime() || Date.now(),
    note: form.note.value.trim(),
    paidBy: form.paidBy ? form.paidBy.value : 'Joint',
    splitType: form.splitType ? form.splitType.value : 'equal',
    percentA: form.percentA ? parseFloat(form.percentA.value)||50 : 50
  };
  state.data.transactions.unshift(txn);
  await persist();
  closeModal();
}
async function deleteTxn(id){
  state.data.transactions = state.data.transactions.filter(t=>t.id!==id);
  await persist(); render();
}
async function submitGoal(form){
  const target = parseFloat(form.targetAmount.value);
  if(!target || target<=0) return;
  const linked = form.fundingSource && form.fundingSource.value === 'linked';
  const startAmount = linked ? (parseFloat(form.currentAmount.value)||0) : 0;
  const goal = {
    id:'g_'+Date.now()+Math.random().toString(36).slice(2,7),
    title: form.title.value.trim(),
    specific: form.specific.value.trim(),
    targetAmount: target,
    currency: form.currency.value,
    currentAmount: startAmount,
    allocatedFromPool: linked ? startAmount : 0,
    attainable: form.attainable.value.trim(),
    relevant: form.relevant.value.trim(),
    deadline: form.deadline.value,
    createdAt: Date.now()
  };
  state.data.goals.push(goal);
  await persist();
  closeModal();
}
async function deleteGoal(id){
  state.data.goals = state.data.goals.filter(g=>g.id!==id);
  await persist(); render();
}
async function submitContribution(goalId, form){
  const add = parseFloat(form.amount.value);
  if(!add) return;
  const g = state.data.goals.find(g=>g.id===goalId);
  if(g) g.currentAmount = (g.currentAmount||0) + add;
  await persist();
  closeModal();
}
async function submitBudget(form){
  const limit = parseFloat(form.limit.value);
  if(!limit || limit<=0) return;
  const existing = state.data.budgets.find(b=>b.category===form.category.value);
  if(existing){ existing.limit = limit; existing.currency = form.currency.value; }
  else state.data.budgets.push({category:form.category.value, limit, currency:form.currency.value});
  await persist();
  closeModal();
}
async function deleteBudget(cat){
  state.data.budgets = state.data.budgets.filter(b=>b.category!==cat);
  await persist(); render();
}
async function saveSettings(form){
  state.data.settings.partnerA = form.partnerA.value.trim() || 'Partner A';
  state.data.settings.partnerB = form.partnerB.value.trim() || 'Partner B';
  state.data.settings.baseCurrency = form.baseCurrency.value;
  state.data.settings.alertThreshold = parseFloat(form.alertThreshold.value)||0;
  await persist(); render();
}
async function toggleCurrency(cur){
  const list = state.data.settings.currencies;
  const i = list.indexOf(cur);
  if(i>=0){ if(list.length>1) list.splice(i,1); } else list.push(cur);
  await persist(); render();
}

/* ============================= RENDER: GATE / SETUP ============================= */
function renderGate(){
  return `
  <div class="gate">
    <svg class="brand-mark" viewBox="0 0 52 52"><circle cx="20" cy="26" r="15" fill="none" stroke="#0B5E56" stroke-width="3"/><circle cx="32" cy="26" r="15" fill="none" stroke="#E3A23C" stroke-width="3"/></svg>
    <h1>Smart Couple</h1>
    <p class="sub">A shared money space for two — built for Filipino couples and OFW families juggling more than one currency.</p>
    <label>Household code</label>
    <input type="text" id="codeInput" placeholder="e.g. DELACRUZ2019" autocomplete="off" />
    <p class="hint">This isn't a password — it's a shared word only the two of you agree on. Whoever types the same code sees the same data. No account, no sign-in.</p>
    <button class="btn" onclick="handleGateSubmit()">Continue</button>
  </div>`;
}
async function handleGateSubmit(){
  const val = document.getElementById('codeInput').value.trim();
  if(!val) return;
  state.code = val;
  const existing = await loadHousehold(val);
  if(existing === 'NOT_CONFIGURED'){
    alert('This app is not connected to a database yet. Whoever set this up needs to paste their Firebase config into the code (see the comment near the top of the <script> tag).');
    return;
  }
  if(existing === 'ERROR'){
    alert('Could not reach the database. Check your internet connection and try again.');
    return;
  }
  if(existing){ state.data = existing; state.screen='app'; subscribeToHousehold(val); startRateAutoRefresh(); }
  else { state.screen = 'setup'; }
  render();
  if(!state.rates) fetchRates();
}
function renderSetup(){
  return `
  <div class="gate">
    <h1>Set up your space</h1>
    <p class="sub">Quick one-time setup for "${state.code}". You can change all of this later in Settings.</p>
    <div class="row">
      <div><label>Your name</label><input type="text" id="setupA" placeholder="e.g. Ana" /></div>
      <div><label>Partner's name</label><input type="text" id="setupB" placeholder="e.g. Ben" /></div>
    </div>
    <label>Home currency (for shared totals & goals)</label>
    <select id="setupBase">${CURRENCIES.map(c=>`<option value="${c}">${c} — ${SYMBOLS[c]}</option>`).join('')}</select>
    <button class="btn" onclick="handleSetupSubmit()">Create our space</button>
  </div>`;
}
async function handleSetupSubmit(){
  const a = document.getElementById('setupA').value.trim() || 'Partner A';
  const b = document.getElementById('setupB').value.trim() || 'Partner B';
  const base = document.getElementById('setupBase').value;
  state.data = defaultData();
  state.data.settings.partnerA = a;
  state.data.settings.partnerB = b;
  state.data.settings.baseCurrency = base;
  state.data.settings.currencies = [base, base==='USD'?'PHP':'USD'];
  await persist();
  state.screen='app';
  subscribeToHousehold(state.code);
  startRateAutoRefresh();
  render();
}

/* ============================= RENDER: APP SHELL ============================= */
function renderApp(){
  const tabs = [
    {id:'dashboard', ic:'🏡', lb:'Home'},
    {id:'transactions', ic:'🧾', lb:'Activity'},
    {id:'goals', ic:'🎯', lb:'Goals'},

      ${tabs.map(t=>`<button class="tab ${state.tab===t.id?'active':''}" onclick="switchTab('${t.id}')"><span class="ic">${t.ic}</span><span class="lb">${t.lb}</span></button>`).join('')}

function fabType(){ return state.tab==='transactions'?'txn': state.tab==='goals'?'goal':'budget'; }
function tabTitle(){
  return {dashboard:'Dashboard', transactions:'Activity', goals:'Goals', budget:'Joint Budget', settings:'Settings'}[state.tab];
}
function switchTab(t){ state.tab = t; render(); }

function renderTabContent(){
  if(state.tab==='dashboard') return renderDashboard();
  if(state.tab==='transactions') return renderTransactions();
  if(state.tab==='goals') return renderGoals();
  if(state.tab==='budget') return renderBudget();

}

/* ---------- Dashboard ---------- */

function renderRateWidget(){
  const s = state.data.settings;
  if(state.ratesLoading) return `<div class="card"><div class="r-row"><span>Fetching latest rates…</span></div></div>`;
  if(!state.rates) return `<div class="card"><div class="r-row"><span>Rates unavailable.</span><button class="refresh-btn" onclick="fetchRates()">Retry</button></div></div>`;
  const rows = s.currencies.filter(c=>c!==s.baseCurrency).map(c=>{
    const rate = convert(1, c, s.baseCurrency);
    return `<div class="r-row"><span>1 ${c} =</span><span class="mono">${rate!==null? fmt(rate,s.baseCurrency): '—'}</span></div>`;
  }).join('');
  const updated = new Date(state.rates.fetchedAt).toLocaleString();
  return `<div class="card"><div class="rate-list">${rows || '<div class=\\"r-row\\"><span>Add a foreign currency in Settings to see it here.</span></div>'}</div>

function renderEmpty(icon, text){

}

/* ---------- Transactions ---------- */
function renderTxnRow(t){
  const cat = CATEGORIES.find(c=>c.id===t.category);
  const s = state.data.settings;
  const converted = t.currency !== s.baseCurrency ? toBase(t.amount, t.currency) : null;
  const paidByName = t.paidBy==='A'? s.partnerA : t.paidBy==='B'? s.partnerB : 'Joint';
  return `
    <div class="txn-row">
      <div class="txn-icon ${t.type==='income'?'income':''}">${cat?cat.icon:'📦'}</div>
      <div class="txn-main">

          <div class="cat">${cat?cat.label:t.category}</div>
          <div class="amt mono ${t.type}">${t.type==='income'?'+':'-'} ${fmt(t.amount, t.currency)}</div>
        </div>
        <div class="meta">${new Date(t.date).toLocaleDateString()} · ${paidByName}${converted!==null?` · ≈ ${fmt(converted, s.baseCurrency)}`:''}${t.type==='expense'?` · split: ${splitLabel(t)}`:''}</div>

function splitLabel(t){
  const s = state.data.settings;

  if(t.splitType==='custom') return `${t.percentA}/${100-t.percentA}`;
  if(t.splitType==='A') return s.partnerA+' only';
  if(t.splitType==='B') return s.partnerB+' only';
  return '50/50';
}
function renderTransactions(){
  const txns = state.data.transactions;
  if(!txns.length) return renderEmpty('🧾','No transactions yet. Tap the gold + button to log your first one.');
  return `<div class="card">${txns.map(t=>renderTxnRow(t)).join('')}</div>`;

/* ---------- Goals ---------- */
function ringSvg(pctTime, pctAmount, behind){
  const r1=30, r2=22, c1=2*Math.PI*r1, c2=2*Math.PI*r2;
  const off1 = c1*(1-pctTime/100);
  const off2 = c2*(1-pctAmount/100);
  return `
  <svg width="76" height="76" viewBox="0 0 76 76" style="flex-shrink:0;">
    <circle cx="38" cy="38" r="${r1}" fill="none" stroke="#DDE7E3" stroke-width="5"/>
    <circle cx="38" cy="38" r="${r1}" fill="none" stroke="#1C8C7C" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${c1}" stroke-dashoffset="${off1}" transform="rotate(-90 38 38)"/>
    <circle cx="38" cy="38" r="${r2}" fill="none" stroke="#FCEFD9" stroke-width="6"/>
    <circle cx="38" cy="38" r="${r2}" fill="none" stroke="${behind?'#DD6B4E':'#E3A23C'}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${c2}" stroke-dashoffset="${off2}" transform="rotate(-90 38 38)"/>
    <text x="38" y="42" text-anchor="middle" font-family="IBM Plex Mono" font-size="14" font-weight="600" fill="#142027">${Math.round(pctAmount)}%</text>
  </svg>`;
}
function renderGoalCard(g){
  const p = goalPace(g);
  return `
  <div class="card goal-card">
    ${ringSvg(p.timePct, p.amountPct, p.behind)}
    <div class="goal-info">
      <h3>${g.title}</h3>
      <div class="meta">${fmt(g.currentAmount,g.currency)} of ${fmt(g.targetAmount,g.currency)} · by ${g.deadline}</div>
      ${g.allocatedFromPool>0 ? `<div class="meta" style="color:var(--teal-deep);">💰 Started from your saved total (${fmt(g.allocatedFromPool, g.currency)})</div>` : ''}
      <div class="goal-pct ${p.behind?'behind':''}">${p.behind? 'Behind pace': 'On track'} · ${p.timePct.toFixed(0)}% of time elapsed</div>
      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn small" onclick="openModal('goal-contrib',{id:'${g.id}'})">Add funds</button>
        <button class="btn small ghost" onclick="deleteGoal('${g.id}')">Remove</button>
      </div>
    </div>
  </div>`;
}
function renderGoals(){
  const goals = state.data.goals;
  if(!goals.length) return renderEmpty('🎯','No goals yet. Tap + to set your first SMART goal — a house downpayment, an emergency fund, a trip home.');
  return goals.map(g=>renderGoalCard(g)).join('');
}

/* ---------- Budget ---------- */
function renderBudget(){
  const budgets = state.data.budgets;
  const s = state.data.settings;
  if(!budgets.length) return renderEmpty('📊','No budget categories yet. Tap + to set a joint monthly limit for something like Food or Padala.');
  return `<div class="card">${budgets.map(b=>{
    const cat = CATEGORIES.find(c=>c.id===b.category);
    const spent = spentInCategory(b.category);
    const limitBase = toBase(b.limit, b.currency);
    const pct = limitBase>0 ? Math.min(100, spent/limitBase*100) : 0;
    const cls = pct>=100?'over':pct>=90?'warn':'';
    return `
    <div class="budget-item">
      <div class="head">
        <span class="cat">${cat?cat.icon:'📦'} ${cat?cat.label:b.category}</span>
        <span class="mono">${fmt(spent,s.baseCurrency)} / ${fmt(limitBase,s.baseCurrency)}</span>
      </div>
      <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%;"></div></div>
      <div style="text-align:right; margin-top:4px;"><button class="del-x" onclick="deleteBudget('${b.category}')" style="font-size:11px;">Remove</button></div>
    </div>`;
  }).join('')}</div>`;
}

        <label>Starting amount</label>
        <input type="number" id="goalCurrent" value="${totalSavings.toFixed(2)}" data-base-total="${totalSavings}" />
        <div class="hint" style="margin-top:-8px;">Filled in from your total saved so far (${fmt(totalSavings, s.baseCurrency)}). Adjust it if you only want to count part of it toward this goal.</div>
      </div>
      <div id="freshWrap" style="display:none;">
        <p class="hint" style="margin-top:-4px;">This goal starts at 0. Every peso toward it will come from "Add funds" going forward.</p>
      </div>
      <label>How will you get there? (Attainable)</label>
      <textarea id="goalAttainable" rows="2" placeholder="e.g. Set aside 10% of joint income monthly"></textarea>
      <label>Why this matters to you both (Relevant)</label>
      <textarea id="goalRelevant" rows="2" placeholder="e.g. Peace of mind before the baby arrives"></textarea>
      <label>Target date (Time-bound)</label>
      <input type="date" id="goalDeadline" />
      <button class="btn gold" onclick="handleGoalSubmit()">Create goal</button>
    </div>
  </div>`;
}
function updateGoalCurrentPrefill(){
  const input = document.getElementById('goalCurrent');
  if(!input) return;
  const baseTotal = parseFloat(input.dataset.baseTotal);
  const targetCur = document.getElementById('goalCurrency').value;
  const baseCur = state.data.settings.baseCurrency;
  const converted = convert(baseTotal, baseCur, targetCur);
  input.value = (converted!==null ? converted : baseTotal).toFixed(2);
}
function setGoalSource(src){
  document.getElementById('srcLinkedBtn').classList.toggle('active', src==='linked');
  document.getElementById('srcFreshBtn').classList.toggle('active', src==='fresh');
  document.getElementById('linkedWrap').style.display = src==='linked' ? 'block':'none';
  document.getElementById('freshWrap').style.display = src==='fresh' ? 'block':'none';
  document.getElementById('goalTitle').dataset.source = src;
}
async function handleGoalSubmit(){
  const source = document.getElementById('goalTitle').dataset.source || 'linked';
  let currentAmountVal = document.getElementById('goalCurrent') ? document.getElementById('goalCurrent').value : '0';
  const form = {
    title:{value:document.getElementById('goalTitle').value},
    specific:{value:document.getElementById('goalSpecific').value},
    targetAmount:{value:document.getElementById('goalTarget').value},
    currency:{value:document.getElementById('goalCurrency').value},
    currentAmount:{value: currentAmountVal},
    fundingSource:{value: source},
    attainable:{value:document.getElementById('goalAttainable').value},
    relevant:{value:document.getElementById('goalRelevant').value},
    deadline:{value:document.getElementById('goalDeadline').value || new Date(Date.now()+31536000000).toISOString().slice(0,10)},
  };
  if(!form.title.value.trim()) form.title.value = 'Untitled goal';
  await submitGoal(form);
}
function renderContribModal(goalId){
  const g = state.data.goals.find(g=>g.id===goalId);
  if(!g) return '';
  return `
  <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2>Add to "${g.title}"</h2>
      <label>Amount (${g.currency})</label>
      <input type="number" id="contribAmount" placeholder="0.00" />
      <button class="btn gold" onclick="submitContribution('${goalId}', {amount:{value:document.getElementById('contribAmount').value}})">Add funds</button>
    </div>
  </div>`;
}
function renderBudgetModal(){
  const s = state.data.settings;
  return `
  <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h2>Set a joint budget</h2>
      <label>Category</label>
      <select id="budgetCategory">${CATEGORIES.map(c=>`<option value="${c.id}">${c.icon} ${c.label}</option>`).join('')}</select>
      <label>Monthly limit</label>
      <div class="row">
        <input type="number" id="budgetLimit" placeholder="0.00" />
        <select id="budgetCurrency">${CURRENCIES.map(c=>`<option value="${c}" ${c===s.baseCurrency?'selected':''}>${c}</option>`).join('')}</select>
      </div>
      <button class="btn" onclick="submitBudget({category:{value:document.getElementById('budgetCategory').value}, limit:{value:document.getElementById('budgetLimit').value}, currency:{value:document.getElementById('budgetCurrency').value}})">Save budget</button>
    </div>
  </div>`;
}

/* ============================= ROOT RENDER ============================= */
function render(){
  const frame = document.getElementById('frame');
  if(state.screen==='gate') frame.innerHTML = renderGate();
  else if(state.screen==='setup') frame.innerHTML = renderSetup();
  else frame.innerHTML = renderApp();
}
render();
</script>
</body>
</html>
